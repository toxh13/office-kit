# CI · 배포
#  - main push / PR: 한글→PDF 변환 프로그램(rhwp 명령줄) 받기 → npm test (+ main push: 한글·Office 편집기 묶음 빌드 확인)
#  - v* 태그 push: 시험 → 한글 편집기(rhwp-studio)·Office 편집기(vendor/office-editor)·rhwp 명령줄(vendor/rhwp-cli) 묶음 → NSIS 설치 파일을 만들어
#    GitHub Release에 올림 → Office 편집기 소스 꾸러미(AGPL 6조)를 같은 Release에 붙임 → 둘 다 있으면 공개
#  - 수동 실행(workflow_dispatch): 같은 빌드를 초안(draft) Release로 올림
name: CI · Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Release를 초안(draft)으로 올리기'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 시험 (npm test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 한글→PDF 시험(test/hwp-pdf.test.mjs)에 rhwp.exe가 필요하다: 고정 크기·SHA-256으로 받아 vendor/rhwp-cli에 넣는다.
      # 받은 zip은 고정 값 파일(빌드 스크립트)의 해시를 키로 캐시 — 고정 값을 올리면 새로 받는다
      - name: rhwp 명령줄 받은 파일 캐시
        uses: actions/cache@v4
        with:
          path: tmp/rhwp-cli-build/download
          key: rhwp-cli-${{ hashFiles('scripts/build-rhwp-cli.mjs') }}
      - name: 한글→PDF 변환 프로그램 (rhwp v0.8.7 → vendor/rhwp-cli)
        shell: bash
        run: |
          node --check scripts/build-rhwp-cli.mjs
          node scripts/build-rhwp-cli.mjs --help
          npm run rhwp-cli:build
          node scripts/build-rhwp-cli.mjs --verify
      - run: npm test
      # 한글 편집기 빌드 스크립트: 문법·옵션은 늘, 실제 빌드는 main push에서 (태그 전에 깨진 것을 알게)
      - name: 한글 편집기 빌드 스크립트 확인
        shell: bash
        run: |
          node --check scripts/build-editor.mjs
          node scripts/build-editor.mjs --help
      # Office 편집기 묶음 스크립트: 문법·옵션은 늘 (단위 시험 scripts/office-editor/*.test.mjs는 npm test에 들어 있음)
      - name: Office 편집기 묶음 스크립트 확인
        shell: bash
        run: |
          node --check scripts/build-office-editor.mjs
          for f in scripts/office-editor/*.mjs; do node --check "$f"; done
          node scripts/build-office-editor.mjs --help
          node scripts/office-editor/third-party.mjs --check
          # AGPL 6조 소스 꾸러미 스크립트는 반드시 있어야 한다 (없으면 소스 없이 배포하게 됨)
          node --check scripts/make-office-source.mjs
          node scripts/make-office-source.mjs --help
      - name: 한글 편집기 빌드 (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run editor:build
      # filex ui.zip(약 100MB)·lock 파일: 키 = 고정 값 파일(pins.mjs)의 해시 — 고정 값을 올리면 새로 받는다
      - name: Office 편집기 받은 파일 캐시 (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: tmp/office-editor-build/download
          key: office-editor-${{ hashFiles('scripts/office-editor/pins.mjs') }}
      - name: Office 편집기 묶음 빌드 (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npm run office-editor:build
          node scripts/build-office-editor.mjs --verify
          # 소스 꾸러미가 태그 때 깨지지 않게 (쓰지 않고 확인만)
          node scripts/make-office-source.mjs --dry-run

  release:
    name: 설치 파일 만들기 · Release 업로드
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 수동 실행은 v<package.json 버전> Release에 올린다 — 이미 공개된 Release(다른 빌드의 설치 파일)에 덧붙이지 않는다
      - name: 수동 실행 대상 Release 확인
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag 은(는) 이미 공개되었습니다. 수동 빌드를 덧붙이지 않습니다 — package.json 버전을 올리세요."
              exit 1
            fi
          fi

      - name: 태그와 package.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$version)이 다릅니다. package.json의 version을 먼저 올리세요."
            exit 1
          fi

      # 앱 안 한글 편집기: rhwp-studio를 고정 태그(커밋 확인)에서 빌드해 vendor/에 넣는다 (새로 받아 30초 안팎).
      # 묶음이 없으면 electron-builder의 beforePack(scripts/check-editor-bundle.cjs)이 빌드를 멈춘다.
      - name: 한글 편집기 빌드 (rhwp-studio → vendor/)
        run: npm run editor:build

      # 앱 안 Office 편집기(문서·표·슬라이드): filex ui.zip을 고정 크기·SHA-256으로 받고, 편집기 파일마다 filex lock과 맞춰 본 뒤
      # 덜어 내어 vendor/office-editor에 넣는다 (VERSION.json·NOTICE-OfficeKit.md 포함).
      # patches/office-editor/filex/*.patch가 있으면 filex 소스(고정 커밋)에 얹어 앱 페이지를 다시 빌드한다 (git·npm).
      # 묶음·라이선스 파일·수정 고지가 없으면 beforePack이 빌드를 멈춘다.
      - name: Office 편집기 받은 파일 캐시
        uses: actions/cache@v4
        with:
          path: tmp/office-editor-build/download
          key: office-editor-${{ hashFiles('scripts/office-editor/pins.mjs') }}
      - name: Office 편집기 묶음 (filex v0.3.1 → vendor/office-editor)
        shell: bash
        run: |
          npm run office-editor:build
          node scripts/build-office-editor.mjs --verify

      # 한글→PDF 변환 프로그램(rhwp 명령줄): Release zip을 고정 크기·SHA-256으로 받아 rhwp.exe·LICENSE·THIRD_PARTY_LICENSES.md를 vendor/rhwp-cli에.
      # 없거나 크기가 다르면 beforePack(scripts/check-editor-bundle.cjs)이 빌드를 멈춘다.
      - name: rhwp 명령줄 받은 파일 캐시
        uses: actions/cache@v4
        with:
          path: tmp/rhwp-cli-build/download
          key: rhwp-cli-${{ hashFiles('scripts/build-rhwp-cli.mjs') }}
      - name: 한글→PDF 변환 프로그램 (rhwp v0.8.7 → vendor/rhwp-cli)
        shell: bash
        run: |
          npm run rhwp-cli:build
          node scripts/build-rhwp-cli.mjs --verify

      # electron-builder는 파일마다 따로 Release를 찾다가 동시에 "없음"을 보고 Release를 두 개 만든다
      # (v0.1.0·v0.1.1에서 설치 파일과 .blockmap이 서로 다른 Release로 갈라짐).
      # 같은 태그의 초안(draft)이 있으면 그것을 그대로 쓰므로, 먼저 초안을 만들고 빌드가 끝나면 공개한다.
      - name: Release 초안 미리 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 이(가) 이미 있습니다 — 그대로 씁니다"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "${GITHUB_REF_NAME#v}" --notes "Office Kit ${GITHUB_REF_NAME#v} 설치 파일"
          fi

      - name: 빌드 · 업로드 (electron-builder)
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft && 'true' || 'false' }}

      # AGPL 6조: 설치 파일에 든 Office 편집기의 소스 꾸러미 office-editor-source-<버전>.zip(+ .sha256)을 같은 Release에 붙인다.
      # (scripts/make-office-source.mjs: filex 소스 고정 커밋 + 우리 패치 + 묶음 만들기·덜어 내기 규칙 + 글꼴 생성기 + 상류 소스 주소)
      - name: Office 편집기 소스 꾸러미 만들기 · 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f scripts/make-office-source.mjs ]; then
            echo "::error::scripts/make-office-source.mjs가 없습니다 — Office 편집기 소스 꾸러미 없이는 배포하지 않습니다 (AGPL 6조)."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          zip="dist/office-editor-source-$version.zip"
          rm -f dist/office-editor-source-*.zip dist/office-editor-source-*.zip.sha256
          node scripts/make-office-source.mjs --out dist
          if [ ! -f "$zip" ]; then
            echo "::error::$zip 가 만들어지지 않았습니다."
            ls -la dist || true
            exit 1
          fi
          files=("$zip")
          if [ -f "$zip.sha256" ]; then files+=("$zip.sha256"); fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$version"; fi
          # 공개된 Release에는 붙이지 않는다 (다른 빌드의 설치 파일과 짝이 맞지 않게 됨) — 초안만
          draft=$(gh release view "$tag" --json isDraft -q .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::Release $tag 이(가) 초안이 아닙니다. 소스 꾸러미를 붙이지 않습니다."
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          echo "Release $tag 에 올림: ${files[*]}"

      - name: Release 공개 (설치 파일·소스 꾸러미가 올라갔는지 확인 후)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          if ! echo "$assets" | grep -q '^OfficeKit-Setup-.*\.exe$'; then
            echo "::error::Release $GITHUB_REF_NAME 에 설치 파일이 없습니다. 초안으로 남겨 둡니다."
            exit 1
          fi
          if ! echo "$assets" | grep -q "^office-editor-source-${GITHUB_REF_NAME#v}\.zip$"; then
            echo "::error::Release $GITHUB_REF_NAME 에 Office 편집기 소스 꾸러미(office-editor-source-${GITHUB_REF_NAME#v}.zip)가 없습니다 (AGPL 6조). 초안으로 남겨 둡니다."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # 태그 빌드는 Release에 이미 올라가므로 수동(초안) 빌드만 보관한다.
      # 계정의 아티팩트 저장 한도가 차면 실패하므로 빌드 결과를 막지 않게 한다.
      - name: 설치 파일 보관 (Actions 아티팩트)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: OfficeKit-Setup
          path: |
            dist/OfficeKit-Setup-*.exe
            dist/latest.yml
            dist/office-editor-source-*.zip
          if-no-files-found: error
