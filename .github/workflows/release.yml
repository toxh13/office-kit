# CI · 배포
#  - main push / PR: npm test
#  - v* 태그 push: 시험 → NSIS 설치 파일을 만들어 GitHub Release에 올림
#  - 수동 실행(workflow_dispatch): 같은 빌드를 초안(draft) Release로 올림
name: CI · Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Release를 초안(draft)으로 올리기'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 시험 (npm test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    name: 설치 파일 만들기 · Release 업로드
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 태그와 package.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$version)이 다릅니다. package.json의 version을 먼저 올리세요."
            exit 1
          fi

      # electron-builder는 파일마다 따로 Release를 찾다가 동시에 "없음"을 보고 Release를 두 개 만든다
      # (v0.1.0·v0.1.1에서 설치 파일과 .blockmap이 서로 다른 Release로 갈라짐).
      # 같은 태그의 초안(draft)이 있으면 그것을 그대로 쓰므로, 먼저 초안을 만들고 빌드가 끝나면 공개한다.
      - name: Release 초안 미리 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 이(가) 이미 있습니다 — 그대로 씁니다"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "${GITHUB_REF_NAME#v}" --notes "Office Kit ${GITHUB_REF_NAME#v} 설치 파일"
          fi

      - name: 빌드 · 업로드 (electron-builder)
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft && 'true' || 'false' }}

      - name: Release 공개 (설치 파일이 올라갔는지 확인 후)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          if ! echo "$assets" | grep -q '^OfficeKit-Setup-.*\.exe$'; then
            echo "::error::Release $GITHUB_REF_NAME 에 설치 파일이 없습니다. 초안으로 남겨 둡니다."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # 태그 빌드는 Release에 이미 올라가므로 수동(초안) 빌드만 보관한다.
      # 계정의 아티팩트 저장 한도가 차면 실패하므로 빌드 결과를 막지 않게 한다.
      - name: 설치 파일 보관 (Actions 아티팩트)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: OfficeKit-Setup
          path: |
            dist/OfficeKit-Setup-*.exe
            dist/latest.yml
          if-no-files-found: error
